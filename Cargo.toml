# El documento de la suite Iurefficient: modelo de bloques sobre Markdown sin pérdidas (`iure-doc`)
# y su editor para egui (`iure-doc-ui`, DocEditor). Lo usan IureDesk, IureProject e IureEditor 2.0.
[workspace]
resolver = "3"
members = ["crates/doc", "crates/doc-ui", "crates/export", "xtask"]

[workspace.package]
version = "0.21.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Eduardo Llaguno"]
repository = "https://github.com/ellaguno/iure-doc"

[workspace.dependencies]
iure-doc = { path = "crates/doc" }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
# Pegar HTML como Markdown (tokenizador, Rust puro; la misma versión que IureDesk).
html5ever = "0.40"
# ui: egui 0.37 en toda la suite; el kit compartido fija la misma versión.
egui = "0.37"
iurefficient-ui = { git = "https://github.com/ellaguno/iurefficient-ui", branch = "main" }
# Imágenes en su lugar (Rust puro; los mismos formatos que IureDesk).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Leer el HTML del portapapeles al pegar (Rust puro: x11rb y wl-clipboard-rs en Linux).
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }
# Corrector ortográfico con diccionarios Hunspell (Rust puro, MPL-2.0).
spellbook = "0.4"
# Resaltado de sintaxis de los bloques de código: gramáticas de Sublime con fancy-regex (Rust puro,
# sin Oniguruma) y sin temas (los colores son los del tema de la suite).
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# Exportar a DOCX: un DOCX es un ZIP; deflate con flate2 y miniz_oxide (Rust puro, sin zlib ni
# bzip2/zstd en C).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Exportar a PDF (característica `pdf` de iure-doc-export): Typst compilado aquí, con sus letras
# incluidas (Libertinus, New Computer Modern, DejaVu Sans Mono; OFL/libres); Rust puro.
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
# pruebas
proptest = "1"
tempfile = "3"
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
