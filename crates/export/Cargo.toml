[package]
name = "iure-doc-export"
description = "Exportar documentos de la suite Iurefficient: HTML autocontenido y DOCX (Rust puro, sin egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
iure-doc.workspace = true
pulldown-cmark.workspace = true
image.workspace = true
zip.workspace = true
typst = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-layout = { workspace = true, optional = true }
typst-assets = { workspace = true, optional = true }
typst-render = { workspace = true, optional = true }

[features]
# Fórmulas dibujadas con Typst (LaTeX → Typst → imagen); pesado de compilar.
math = ["dep:typst", "dep:typst-layout", "dep:typst-assets", "dep:typst-render"]
# PDF con Typst (con las fórmulas de verdad).
pdf = ["math", "dep:typst-pdf"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
